# General settings
num_gpu: auto

# Dataset paths
data:
  train_hr: "data/DIV2K_train_HR" 
  train_lr: "data/DIV2K_train_LR_bicubic/X2"
  valid_hr: "data/DIV2K_valid_HR"
  valid_lr: "data/DIV2K_valid_LR_bicubic/X2"

# Model parameters
model:
  scale: 2
  n_resblocks: 16
  n_feats: 64
  rgb_range: 255
  n_colors: 3
  res_scale: 1.0

# Training parameters
training:
  epochs: 200
  batch_size: 16
  lr: 0.0001
  lr_patch_size: 48

# Testing parameters
test:
  pretrained_model: "pretrained/trifa_x2.pth"
  input_dir: "data/single"
  output_dir: "results/trifa_x2/visualizations"
