name: TriFANet_DF2K_x2
model_type: SRModel
scale: 2
num_gpu: auto
manual_seed: 10

datasets:
  train:
    name: DF2K
    type: PairedImageDataset
    dataroot_gt: ./datasets/DF2K/HR
    dataroot_lq: ./datasets/DF2K/LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: True
    use_rot: True

    # data loader
    use_shuffle: True
    num_worker_per_gpu: 4
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    task: SR
    name: Set5
    type: PairedImageDataset
    dataroot_gt: datasets/benchmark/Set5/HR
    dataroot_lq: datasets/benchmark/Set5/LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

network_g:
  type: TriFANet
  num_feat: 64

path:
  pretrain_network_g: experiments/TriFANet_DF2K_x2/models/net_g_445000.pth
  strict_load_g: True
  resume_state: experiments/TriFANet_DF2K_x2/training_state/445000.state

train:
  optim_g:
    type: Adam
    lr: !!float 1e-4
  total_iter: 500000
  warmup_iter: -1
  lr_scheduler:
    type: CosineAnnealingLR
    T_max: 500000
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
  scheduler:
    type: MultiStepLR
    milestones: [250000, 400000, 450000, 475000]
    gamma: 0.5

val:
  val_freq: 5000
  save_img: False

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: True

logger:
  print_freq: 200
  save_checkpoint_freq: !!float 5e3
  use_tb_logger: True
  wandb:
    project: ~
    resume_id: ~
