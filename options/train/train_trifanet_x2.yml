name: TriFANet_DF2K_x2
model_type: SRModel
scale: 2
num_gpu: auto
manual_seed: 10

datasets:
  train:
    name: DF2K
    type: PairedImageDataset
    dataroot_gt: ./datasets/DF2K/HR
    dataroot_lq: ./datasets/DF2K/LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

    gt_size: 128
    use_hflip: True
    use_rot: True

    # data loader
    use_shuffle: True
    num_worker_per_gpu: 12
    batch_size_per_gpu: 8
    dataset_enlarge_ratio: 1
    prefetch_mode: ~

  val:
    task: SR
    name: Set5
    type: PairedImageDataset
    dataroot_gt: datasets/benchmark/Set5/HR
    dataroot_lq: datasets/benchmark/Set5/LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

network_g:
  type: TriFANet
  num_feat: 64

path:
  pretrain_network_g: ~
  strict_load_g: True
  resume_state: ~

train:
  optim_g:
    type: Adam
    lr: !!float 1e-4
  total_iter: 500000
  warmup_iter: -1
  lr_scheduler:
    type: CosineAnnealingLR
    T_max: 500000
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
  scheduler:
    type: MultiStepLR
    milestones: [250000, 400000, 450000, 475000]
    gamma: 0.5

val:
  val_freq: 5000
  metrics:
    psnr:
      type: calculate_psnr
    ssim:
      type: calculate_ssim

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: true
  wandb:
    project: TriFA-Net
