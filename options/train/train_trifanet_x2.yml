name: TriFANet_DF2K_x2
model_type: SRModel
scale: 2

datasets:
  train:
    name: DF2K
    type: PairedImageDataset
    dataroot_gt: ./datasets/DF2K/HR
    dataroot_lq: ./datasets/DF2K/LR_bicubic/X2
    io_backend:
      type: disk

  val:
    name: DF2K_val
    type: PairedImageDataset
    dataroot_gt: ./datasets/DF2K_val/HR
    dataroot_lq: ./datasets/DF2K_val/LR_bicubic/X2
    io_backend:
      type: disk

network_g:
  type: TriFANet
  num_feat: 64
  scale: 2

train:
  optim_g:
    type: Adam
    lr: 1e-4
  total_iter: 500000
  warmup_iter: -1
  lr_scheduler:
    type: CosineAnnealingLR
    T_max: 500000
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0

val:
  val_freq: 5000
  metrics:
    psnr:
      type: calculate_psnr
    ssim:
      type: calculate_ssim

logger:
  print_freq: 100
  save_checkpoint_freq: 5000
  use_tb_logger: true
  wandb:
    project: TriFA-Net
