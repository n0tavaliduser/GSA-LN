name: GSA-LN_DF2K_x2
model_type: SRModel
scale: 2
num_gpu: auto
manual_seed: 10

datasets:
  train:
    name: DF2K
    type: PairedImageDataset
    dataroot_gt: ./datasets/DF2K/HR
    dataroot_lq: ./datasets/DF2K/LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

    gt_size: 192 # [192 x 192 => 384 x 384]
    use_hflip: True
    use_rot: True

    # data loader
    use_shuffle: True
    num_worker_per_gpu: 2
    batch_size_per_gpu: 4
    dataset_enlarge_ratio: 2
    prefetch_mode: ~

  val:
    task: SR
    name: Set5
    type: PairedImageDataset
    dataroot_gt: datasets/benchmark/Set5/HR
    dataroot_lq: datasets/benchmark/Set5/LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

network_g:
  type: GSALN
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_blocks: 16
  upscale: 2
  freq_mb: True
  low_thr: 0.33
  mid_thr: 0.66
  mask_order: 'natural'
  shift_mag: False

path:
  pretrain_network_g: experiments/GSALN_x2_tta_x8/models/net_g_470000.pth
  strict_load_g: True
  resume_state: experiments/GSALN_x2_tta_x8/training_state/470000.state

train:
  optim_g:
    type: Adam
    lr: !!float 2e-4
  total_iter: 500000
  warmup_iter: 5000
  scheduler:
    type: CosineAnnealingRestartLR
    periods: [250000, 250000]
    restart_weights: [1, 1]
    eta_min: !!float 1e-7
  pixel_opt:
    type: L1Loss
    loss_weight: 1.0
    reduction: mean

val:
  val_freq: 1000
  save_img: False
  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: True
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: True

logger:
  print_freq: 200
  save_checkpoint_freq: !!float 1e3
  use_tb_logger: True
  wandb:
    project: ~
    resume_id: ~
