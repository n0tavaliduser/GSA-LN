name: TriFANet_eval_20000
model_type: SRModel
scale: 2
num_gpu: 1

datasets:
  test_1:
    task: SR
    name: Set5
    type: PairedImageDataset
    dataroot_gt: datasets/benchmark/Set5/HR
    dataroot_lq: datasets/benchmark/Set5/LR_bicubic/X2
    filename_tmpl: '{}x2'
    io_backend:
      type: disk

network_g:
  type: TriFANet
  num_in_ch: 3
  num_out_ch: 3
  num_feat: 64
  num_blocks: 16
  upscale: 2

path:
  pretrain_network_g: experiments/pretrained_models/models/net_g_20000.pth
  strict_load: true
  resume_state: ~

val:
  save_img: True
  suffix: ~
  use_chop: False

  metrics:
    psnr:
      type: calculate_psnr
      crop_border: 2
      test_y_channel: True
    ssim:
      type: calculate_ssim
      crop_border: 2
      test_y_channel: True